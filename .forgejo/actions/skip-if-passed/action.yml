# skip-if-passed — org 标准内容去重 (ff-merge 后同 SHA 跳过重复 CI)
#
# [定位] CI 机制类逻辑: 少变, 机器同步分发 — 人工不修改本文件; 修改请到 SSOT 上游
#   (lc-studio/forgejo-actions actions/skip-if-passed), 经 sync 流程分发到各仓库
#   .forgejo/actions/skip-if-passed/ (漂移检测: tools/check-drift.sh).
#
# [职责边界] 查询当前 commit 是否已有成功的本 workflow run, 命中则输出 should_skip=true,
#   由调用方后续 step 的 if 跳过 (编排留在 workflow, 本 action 只做判定)。
#
# [契约]
#   - 输出: should_skip ('true'/'false'), reason (passed_before / no_history)
#   - 调用方约定 (薄骨架标准形态, 按档位两形):
#     - 门禁档 (ci-merge / ci-deploy 骨架) — 仅 push 事件查询:
#         if: github.event_name == 'push'      # PR close-reopen 同 SHA 场景, 历史
#         continue-on-error: true              # push run 的 success 会误跳过 PR 的
#                                             # 验证 — PR 是合并前主场景
#     - 周期档 (ci-periodic 骨架) — 仅 schedule 事件查询 (per-SHA 去重; dispatch 是
#       显式重试意图, 不查询):
#         if: github.event_name == 'schedule'
#         continue-on-error: true
#     - name: skip-if-passed / id: skip / uses: 本地 action 路径
#       # 后续阻塞 step 均带: if: steps.skip.outputs.should_skip != 'true'
#   - 本 action 不含 continue-on-error / 事件过滤 (那是编排, 属调用方); API 失败时
#     curl -sf 返回非零 → step 失败 → 由调用方 continue-on-error 兜底为 fail-open
#     (should_skip 为空, 后续照常执行), 不阻断 CI。
#
# [机制] 不引入本地状态, 不依赖 cache — 过滤全量下沉服务端查询参数:
#   GET /repos/{owner}/{repo}/actions/runs?head_sha={sha}&status=success&workflow_id={wf}
#   total_count > 0 → 该 commit 已通过本 workflow 门禁 → should_skip=true。
#   三参数均为 Forgejo 原生查询参数 (v15 LTS / v16 stable 源码验证, run_list.go
#   ToConds: head_sha→commit_sha / workflow_id 为 builder.Eq 精确匹配, status 走 In):
#     head_sha    → 钉住被测 commit (tree 随之钉死: 代码 + workflow 定义本体)
#     workflow_id → 区分同 SHA 上的多道门 (ci-merge vs ci-deploy vs ci-periodic,
#                   防跨门毒化 — P0 过 ≠ P1 过, 故 ci-deploy/ci-periodic 骨架显式传
#                   workflow_file 自指)
#     status      → success
#   total_count 由 db.FindAndCount 给出, 已含全部过滤条件, 无 limit 窗口截断问题。
#
# [教训: v2.2-v2.3 探针从未命中 (issue #5)] 当时客户端 jq 复断言引用了响应中不存在
#   的字段 (.head_sha — 条目实际字段名是 commit_sha), select 恒空 → count 恒 0 →
#   永远不跳; 曾据以信任的 "run 9843 活体验证" 实为 feature 分支 push 被 job-if
#   拦截的 skipped, 并非探针命中。本版修复 = 过滤下沉服务端, 客户端只读 total_count,
#   不再对响应条目内部字段做任何假设。
#
# [边界]
#   - 手动 re-run (workflow_dispatch) 的成功记录同样计入 → 调用方用 if 排除 dispatch 事件
#   - 仅判定 commit SHA, 不判定 tree 内容; squash/rebase merge (SHA 变) 不覆盖
#   - workflow_id 按裸文件名精确匹配; 上游若改存路径形式则匹配落空 → fail 向不跳 (安全方向)
#   - fail-open 有界: --max-time 30 保证 API 挂起不至于耗完 job timeout
#
# [为何单 job 内联形态演进为本 action] 双 job (pre+check) 中 pre 发生 job 级故障时,
#   check 被静默 skip → CI 绿但零测试 (silent-green-CI, directory-algebra #161); 本地
#   action + 薄骨架保持单 job 结构, action 文件机器同步杜绝 7 份内联拷贝的漂移重演。
name: Skip if commit already passed
description: |
  若当前 commit 已有成功的本 workflow run, 输出 should_skip=true。
  典型用途: 避免 ff-merge 后同 commit 重复跑 CI。

inputs:
  github_token:
    description: 用于调 API 的 token, 默认用 job 自动注入的 github.token
    required: false
    default: ${{ github.token }}
  workflow_file:
    description: 过滤的 workflow 文件名 (须与 forgejo DB 的 workflow_id 一致, 即裸文件名; 门禁档自指, 默认 ci-merge.yml)
    required: false
    default: ci-merge.yml

outputs:
  should_skip:
    description: "true 或 false (字符串)"
    value: ${{ steps.check.outputs.should_skip }}
  reason:
    description: 判定原因 (passed_before / no_history)
    value: ${{ steps.check.outputs.reason }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        TOKEN: ${{ inputs.github_token }}
        API: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        WORKFLOW_FILE: ${{ inputs.workflow_file }}
      run: |
        set -euo pipefail
        count=$(curl -sf --max-time 30 -H "Authorization: token $TOKEN" \
          "$API/repos/$REPO/actions/runs?head_sha=$SHA&status=success&workflow_id=$WORKFLOW_FILE" \
          | jq '.total_count // 0')
        if [ "$count" -gt 0 ]; then
          echo "should_skip=true" >> "$GITHUB_OUTPUT"
          echo "reason=passed_before" >> "$GITHUB_OUTPUT"
          echo "✓ 跳过: commit ${SHA:0:8} 已有成功的 $WORKFLOW_FILE run × ${count}"
        else
          echo "should_skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=no_history" >> "$GITHUB_OUTPUT"
          echo "→ 不跳过: commit ${SHA:0:8} 无成功的 $WORKFLOW_FILE run 记录"
        fi
