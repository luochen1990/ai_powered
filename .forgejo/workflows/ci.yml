# ai-powered — Forgejo Actions CI 门禁 (薄入口形态, 2026-09-10; 升级自 #33 v1 模板).
#
# 三层架构 (设计依据与接入指南见 lc-studio/forgejo-actions README):
#   骨架层  本文件 — check-drift 结构断言锁死 (forgejo-actions tools/check-drift.sh),
#           人工仅改 ⟦⟧ 标记字段
#   逻辑层  .forgejo/actions/skip-if-passed — 机器同步自 forgejo-actions SSOT,
#           人工不改; 修改请到上游仓库再 sync
#   契约层  Justfile `ci` recipe — 质量门禁各仓库自由实现
#
# 各机制的完整踩坑注释 (为何 push 仅 master / edited 订阅 / draft 门禁 / 单 job 内联
# skip / TOFU / key 清理) 在 SSOT 骨架模板头 (templates/ci.skeleton.yml, 含 v2→v2.1
# 设计修正记录) 与 v1 模板, 本文件头只保留索引。
#
# ⟦ai-powered⟧ 特有形态:
#   - LLM provider env 块 (test/llm/* 认证, 见 step 内注释)
#   - venv 持久卷 (VIRTUAL_ENV 指向 cache 卷; just ci 内戳块自愈重建)
#   - runner label: vm-nix (org 共享, capacity=1 单槽位串行)。工具链 VM 预装, CI 禁 nix 求值。
name: ci

on:
  push:
    # 事件去重: push 仅 master (合并后 commit); feature branch 的 push 由 PR 覆盖
    branches: [master]
  pull_request:
    # 前 3 项为 forgejo 服务端默认事件集 (显式列出); edited 为 WIP 门禁衔接 —
    # 去 WIP 前缀 (PR ready) 时补跑 CI (draft PR 被 job if 跳过, 不订阅 edited
    # 则去 WIP 后拿不到补跑)
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # 手动重试: forgejo UI → Actions → ci → Run workflow

# PR 并发去旧: 同 PR 快速多次 push 取消旧 run (单槽位 runner 不被已 supersede 的
# 旧 run 占位)。push 与 PR 的 ref 不同 (分支 ref vs head ref), 天然不同 group 不互踩。
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: vm-nix
    # 事件去重 (push 仅 master) + WIP 门禁 (draft PR 不烧 CI; 判定用
    # pull_request.draft = forgejo IsWorkInProgress(), 阻塞合并的同一 SSOT;
    # 全 skip 时 run 结论 skipped 非 success, 不污染 skip-if-passed)
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/master') && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    timeout-minutes: 30
    env:
      VIRTUAL_ENV: /var/lib/forgejo-runner/cache/ai-powered-venv
      POETRY_CACHE_DIR: /var/lib/forgejo-runner/cache/poetry
      # LLM provider: sg default-plan 入口 (选型依据见历史 PR). api_key 为公开字面量
      # public (sg 主实例无 IdP, 边缘任意 bearer 均可, 智谱真实凭据由 sg 注入),
      # 不占 repo secret. 风险面: 同网关背后由免费池变为付费套餐配额, LAN 内可达
      # 10.168.0.1:18787 的设备均可消耗配额 — 暴露面限家庭内网, 属可接受.
      # FEATURES pin=tools: structured_outputs 实测不可用 (见 #33 系列讨论), tools 适配器路径.
      OPENAI_API_KEY: public
      OPENAI_BASE_URL: http://10.168.0.1:18787/o/default-plan
      OPENAI_MODEL_NAME: flash
      OPENAI_MODEL_FEATURES: tools
      # temperature 0 对齐 baseline 脚本复现性方法论, 显著降低输出随机性 (实测
      # test_extract_identity 失败率 ~17% -> 个位数).
      OPENAI_EXTRA_BODY: '{"temperature": 0}'
      DEBUG: "True"
    steps:
      # ── checkout 链 (骨架内联; 无法 action 化, 见 SSOT 骨架模板头设计修正记录) ──
      # 不用 actions/checkout: 实例 DISABLE_HTTP_GIT=true + SSH 用户名 forgejo +
      # 端口 5522, 官方 action 硬编码不兼容。host key TOFU: 优先 SSH_KNOWN_HOSTS
      # secret 固定 (消除动态 keyscan 的 MITM 窗口); secret 缺失退回动态 keyscan +
      # stderr 警告。服务端 host key 变更须同步轮换该 secret。
      # PR 事件 fetch base+head (支持三点 diff); 其他事件浅克隆 --depth 1 省时。
      - name: Checkout via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "WARN: repo secret SSH_KNOWN_HOSTS 未设置 (TOFU 固定要求), 退回动态 ssh-keyscan (存在 MITM 窗口)." >&2
            ssh-keyscan -p 5522 git.lambda.lc >> ~/.ssh/known_hosts
          fi
          git init
          git remote add origin "ssh://forgejo@git.lambda.lc:5522/${GITHUB_REPOSITORY}.git"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git fetch --no-tags origin "$GITHUB_SHA"
          else
            git fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git checkout "$GITHUB_SHA"

      # 最小权限收尾: 清理 deploy key — runner VM 与缓存卷为 org 各仓库共享 (单槽位
      # 串行), 不清理则本 repo 的只读 key 对其他 repo 的后续 job 可读。
      - name: Cleanup deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      # ── 内容去重 (checkout 后, 本地 action 此时才可读; 编排在骨架, 判定在逻辑层) ──
      # 仅 push 事件查询 (PR close-reopen 同 SHA 场景历史 success 会误跳过 PR 验证);
      # continue-on-error: API 失败退化为不跳过 (fail-open, 不阻断 CI)。
      # 代价: push 事件命中跳过时白做一次 checkout (~1-2s 浅克隆, 可忽略)。
      - name: skip-if-passed
        id: skip
        uses: ./.forgejo/actions/skip-if-passed
        # success() 显式写出隐式默认门 (if 条件不含 status 函数时自动前缀 success() &&),
        # 不依赖读者知晓该规则; 效果: checkout 失败时不进空 workspace 跑探针
        if: success() && github.event_name == 'push'
        continue-on-error: true

      # 质量门禁 — 契约层入口, justfile 实现 `ci` recipe:
      # install (venv 版本戳复用 + poetry sync) → pyright → flake8 → examples 全链
      # (LLM 真端点, reruns 抗抖动; use_google_search deselect 见 recipe 注释)。
      - name: Quality gate (just ci)
        # success() 同上 (显式默认门): checkout 失败时不进空 workspace 跑 just, 避免次级噪音
        if: success() && steps.skip.outputs.should_skip != 'true'
        run: just ci
