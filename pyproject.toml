[tool.poetry]
name = "ai-powered"
version = "0.3.1"
description = "The easiest way to develop AI-Powered applications"
authors = [ "Luo Chen <luochen1990@gmail.com>" ]
repository = "https://github.com/luochen1990/ai_powered"
readme = "README.md"
include = [
    "src",
    # 内置 bench suite 数据目录 (非包, 无 __init__.py): llm-bench 经 git 依赖安装后 load_suite 要读得到
    { path = "src/ai_powered/llm_bench/suites", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openai = "^1.83.0 || ^2.0.0"
msgspec = "^0.19.0 || ^0.20.0 || ^0.21.0"
easy-sync = "^0.2.2"
requests = "^2.32.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.0 || ^9.0.0"
pytest-asyncio = "^0.23.8 || ^1.0.0"
pytest-cov = "^5.0.0 || ^6.0.0 || ^7.0.0"
pytest-xdist = "^3.6.1"
pytest-rerunfailures = "^15.0"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1.401"
funix = "^0.6.2"
flake8 = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["test", "test/examples/**/*.py"]
python_files = ["test_*.py", "test/examples/**/*.py"]
addopts = "-n auto"

[tool.pyright]
strict = ["all"]
# bench suite 内容是用例数据 (运行时按路径加载), 合法性由加载时校验 + 单测 + e2e 守护, 不走静态类型门禁
ignore = ["src/ai_powered/llm_bench/suites"]

[tool.yapf]
based_on_style = "google"
column_limit=150
dedent_closing_brackets=true
join_multiple_lines=true
split_before_first_argument=true
indent_blank_lines=false
spaces_around_default_or_named_assign=true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
